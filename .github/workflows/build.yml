name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm install

      - name: Download mihomo core
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          $headers = @{ "User-Agent" = "gh-actions"; "Authorization" = "Bearer $env:GH_TOKEN" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -match "^mihomo-windows-amd64-v.*\.zip$" } | Select-Object -First 1
          if (-not $asset) { throw "mihomo amd64 asset not found" }
          Write-Host "Downloading $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mihomo.zip
          Expand-Archive -Path mihomo.zip -DestinationPath mihomo-tmp -Force
          $exe = Get-ChildItem mihomo-tmp -Filter *.exe -Recurse | Select-Object -First 1
          Copy-Item $exe.FullName "src-tauri/binaries/mihomo-x86_64-pc-windows-msvc.exe" -Force
          Remove-Item mihomo.zip, mihomo-tmp -Recurse -Force

      - name: Generate icons
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Drawing
          $size = 1024
          $bmp = New-Object System.Drawing.Bitmap $size, $size
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::FromArgb(255, 27, 29, 33))
          $circle = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(255, 75, 139, 245))
          $g.FillEllipse($circle, 96, 96, 832, 832)
          $inner = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(255, 31, 111, 67))
          $g.FillEllipse($inner, 288, 288, 448, 448)
          $font = New-Object System.Drawing.Font "Segoe UI", 300, ([System.Drawing.FontStyle]::Bold)
          $white = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::White)
          $fmt = New-Object System.Drawing.StringFormat
          $fmt.Alignment = [System.Drawing.StringAlignment]::Center
          $fmt.LineAlignment = [System.Drawing.StringAlignment]::Center
          $rect = [System.Drawing.RectangleF]::new(288, 288, 448, 448)
          $g.DrawString("V", $font, $white, $rect, $fmt)
          $g.Dispose()
          $bmp.Save("$PWD\icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()
          npx tauri icon icon.png

      - name: Build
        run: npm run tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VpnBrowser-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: VpnBrowser v0.1.${{ github.run_number }}
          body: "自动构建的 Windows 安装包（含内置 mihomo 核心）。"
          files: src-tauri/target/release/bundle/nsis/*.exe
